<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <!-- Top Half Gradient (Deep Navy -> Tech Blue) -->
    <linearGradient id="topHalfGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Bottom Half Gradient (Cyan -> Vibrant Teal) -->
    <linearGradient id="botHalfGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#00D4C8" />
    </linearGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="50%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#00D4C8" />
    </linearGradient>

    <style>
      .wordmark-primary { fill: #0B1F3A; }
      .wordmark-accent { fill: url(#botHalfGrad); }
      @media (prefers-color-scheme: dark) {
        .wordmark-primary { fill: #F1F5F9; }
      }
    </style>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(16, 10)">
    <!-- Outer Hexagon Wireframe -->
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#frameGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-opacity="0.75" />

    <!-- Subtle Graph Connection Lines -->
    <g stroke="url(#frameGrad)" stroke-width="1.5" stroke-opacity="0.3">
      <line x1="50" y1="6" x2="50" y2="20" />
      <line x1="88" y1="28" x2="72" y2="33" />
      <line x1="12" y1="28" x2="28" y2="33" />
      <line x1="88" y1="72" x2="72" y2="67" />
      <line x1="12" y1="72" x2="28" y2="67" />
      <line x1="50" y1="94" x2="50" y2="80" />
    </g>

    <!-- Crisp Interlocking Geometric 'S' — Upper Block -->
    <polygon points="50,20 72,33 61,39 50,33 39,39 67,55 56,61 28,45 28,33" fill="url(#topHalfGrad)" />

    <!-- Crisp Interlocking Geometric 'S' — Lower Block -->
    <polygon points="50,80 28,67 39,61 50,67 61,61 33,45 44,39 72,55 72,67" fill="url(#botHalfGrad)" />

    <!-- Outer Vertex Nodes -->
    <circle cx="50" cy="6" r="4" fill="#0E7490" />
    <circle cx="88" cy="28" r="4" fill="#00B8C4" />
    <circle cx="88" cy="72" r="4" fill="#00D4C8" />
    <circle cx="50" cy="94" r="4" fill="#0891B2" />
    <circle cx="12" cy="72" r="4" fill="#0B1F3A" />
    <circle cx="12" cy="28" r="4" fill="#0C3E6B" />
  </g>

  <!-- WORDMARK -->
  <text x="126" y="74" font-family="&#39;Inter&#39;, system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">
    <tspan class="wordmark-primary">Squad</tspan><tspan class="wordmark-accent">Opt</tspan>
  </text>
</svg>